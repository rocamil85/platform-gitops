apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-observer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-observer
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-observer
subjects:
  - kind: ServiceAccount
    name: platform-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-observer
